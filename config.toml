#
# Theme setup
#
# If you use go mod to install your theme, you must use the URL of the theme.
# If your theme is in the themes directory, you just need to specify its name.
#
baseURL = "https://yonmilk.gitlab.io/portfolio/"
title = "YONMILK"
description = "Personal blog sharing thoughts, experiences, and discoveries"
theme = ["github.com/adityatelange/hugo-PaperMod"]

[pagination]
pagerSize = 5

enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true
mainsections = ["posts", "papermod"]

[minify]
disableXML = true

[languages.en]
languageName = "English"
weight = 1

[languages.en.taxonomies]
category = "categories"
tag = "tags"
series = "series"

[[languages.en.menu.main]]
name = "WORK"
url = "/work/"
weight = 1
[[languages.en.menu.main]]
name = "LIFE"
url = "/life/"
weight = 2
[[languages.en.menu.main]]
name = "PROFILE"
url = "/profile/"
weight = 3

[languages.fr]
languageName = ":fr:"
weight = 2
title = "PaperModL2"

[languages.fr.taxonomies]
category = "FRcategories"
tag = "FRtags"
series = "FRseries"

[[languages.fr.menu.main]]
name = "Archive"
url = "archives/"
weight = 5
[[languages.fr.menu.main]]
name = "FRTags"
url = "frtags"
weight = 10
[[languages.fr.menu.main]]
name = "FRCategories"
url = "frcategories"
weight = 10
[[languages.fr.menu.main]]
name = "FRSeries"
url = "frseries"
weight = 10
[[languages.fr.menu.main]]
name = "NullLink"
url = "#"

[languages.fr.params]
languageAltTitle = "French"

[languages.fr.params.profileMode]
enabled = true
title = "PaperMod"
imageUrl = "https://raw.githubusercontent.com/googlefonts/noto-emoji/master/svg/emoji_u1f9d1_1f3fb_200d_1f4bb.svg"
imageTitle = "ProfileMode image"
subtitle = "☄️ Fast | ☁️ Fluent | 🌙 Smooth | 📱 Responsive"

[[languages.fr.params.profileMode.buttons]]
name = "Blog"
url = "posts"
[[languages.fr.params.profileMode.buttons]]
name = "Profile Mode"
url = "https://github.com/adityatelange/hugo-PaperMod/wiki/Features#profile-mode"

[languages.fa]
languagedirection = "rtl"
weight = 3
title = "PaperMod RTL"

[languages.fa.taxonomies]
category = "FAcategories"
tag = "FAtags"
series = "FAseries"

[[languages.fa.menu.main]]
name = "FATags"
url = "fatags"
weight = 10

[languages.fa.params.homeInfoParams]
Title = "Hi there 👋"
Content = "Welcome to RTL layout"

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
env = "production"
description = "Personal blog sharing thoughts, experiences, and discoveries"
author = "YONMILK"
defaultTheme = "light"
disableThemeToggle = true
ShowShareButtons = false
ShowReadingTime = false
displayFullLangName = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = false
ShowRssButtonInSectionTermList = false
ShowAllPagesInArchive = false
ShowPageNums = false
ShowToc = false

[params.profileMode]
enabled = false

[[params.socialIcons]]
name = "github"
title = "View Source on Github"
url = "https://github.com/yonmilk"

[params.assets]
disableHLJS = true

[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
noClasses = false

[services.instagram]
disableInlineCSS = true
[services.twitter]
disableInlineCSS = true
