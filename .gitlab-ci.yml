image: node:20-alpine

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/
    - .next/cache/

variables:
  NODE_ENV: production

build:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - out/
    expire_in: 1 week
  only:
    - main

pages:
  stage: deploy
  dependencies:
    - build
  script:
    - mkdir public
    - cp -r out/* public/
  artifacts:
    paths:
      - public
  only:
    - main