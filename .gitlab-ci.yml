image: node:20

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/
    - .next/cache/
    - .npm/

variables:
  NODE_ENV: production

build:
  stage: build
  before_script:
    - node --version
    - npm --version
  script:
    - npm ci --cache .npm --prefer-offline --include=dev
    - echo "Contents of current directory before build:"
    - ls -la
    - npm run build
    - echo "Contents of current directory after build:"
    - ls -la
    - echo "Checking if out/ directory exists:"
    - ls -la out/ || echo "out/ directory does not exist"
    - echo "Force creating out/ directory if it doesn't exist:"
    - test -d out/ || (echo "out/ directory missing, checking .next directory" && ls -la .next/ && exit 1)
  artifacts:
    paths:
      - out/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  dependencies:
    - build
  script:
    - mkdir -p public
    - if [ -d "out" ] && [ "$(ls -A out)" ]; then cp -r out/* public/; else echo "out directory is empty or does not exist"; exit 1; fi
    - ls -la public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
