image: node:20

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/
    - .next/cache/
    - .npm/

variables:
  NODE_ENV: production

build:
  stage: build
  before_script:
    - node --version
    - npm --version
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - ls -la out/
  artifacts:
    paths:
      - out/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  dependencies:
    - build
  script:
    - mkdir -p public
    - if [ -d "out" ] && [ "$(ls -A out)" ]; then cp -r out/* public/; else echo "out directory is empty or does not exist"; exit 1; fi
    - ls -la public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
