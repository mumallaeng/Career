image: hugomods/hugo:exts
---
variables:
  HUGO_ENV: production
  THEME_URL: "github.com/adityatelange/hugo-PaperMod"
---
default:
  before_script:
    - hugo version
    - hugo mod get -u $THEME_URL
---
test:
  script:
    - hugo --minify
  rules:
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
---
create-pages:
  stage: deploy
  script:
    - hugo --minify
  pages: 
    publish: public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH